name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile deterministic scripts
        run: python3 -m compileall -q skills/scout/scripts tests
      - name: Run release-gate suite
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build immutable Scout image
        run: docker build --pull -t scout:test .
      - name: Smoke-test supervised container boot
        shell: bash
        run: |
          set -euo pipefail
          container="scout-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-home"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" \
            --env AGENT_ID= \
            --volume "$volume:/var/lib/hermes" \
            scout:test >/dev/null

          ready=false
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [[ "$state" != "running" ]]; then
              break
            fi
            logs="$(docker logs "$container" 2>&1)"
            if grep -Eq 'fatal:|unable to start service' <<<"$logs"; then
              break
            fi
            if grep -q 'service scout-scope successfully started' <<<"$logs" \
              && grep -q 'service dashboard successfully started' <<<"$logs"; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "true" ]]; then
            docker inspect "$container"
            docker logs "$container" 2>&1
            exit 1
          fi

          docker exec "$container" test -f /var/lib/hermes/skills/scout/SKILL.md
          docker exec "$container" \
            /opt/hermes/.venv/bin/python3 \
            /opt/plow/agent-index-client.py --self-check
